name: Publish NuGet package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish. Publish IsWiX.Compression before IsWiX.Compression.Cab.
        type: choice
        options:
          - IsWiX.WindowsInstaller
          - IsWiX.Compression
          - IsWiX.Compression.Cab
        default: IsWiX.WindowsInstaller
      bump:
        description: Which part of the version to increment ("none" publishes the version already in the project file)
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install sign CLI tool
        run: dotnet tool install --tool-path . --prerelease sign

      - name: Resolve the package
        id: pkg
        shell: pwsh
        run: |
          $name = '${{ inputs.package }}'
          $tests = if ($name -eq 'IsWiX.WindowsInstaller') { 'IsWiX.WindowsInstaller.Tests/IsWiX.WindowsInstaller.Tests.csproj' } else { 'IsWiX.Compression.Cab.Tests/IsWiX.Compression.Cab.Tests.csproj' }
          # The original package keeps its plain v1.2.3 tags; the others are prefixed with the package name.
          $tagPrefix = if ($name -eq 'IsWiX.WindowsInstaller') { 'v' } else { "$name-v" }
          "name=$name" >> $env:GITHUB_OUTPUT
          "project=$name/$name.csproj" >> $env:GITHUB_OUTPUT
          "folder=$name" >> $env:GITHUB_OUTPUT
          "tests=$tests" >> $env:GITHUB_OUTPUT
          "tagprefix=$tagPrefix" >> $env:GITHUB_OUTPUT

      - name: Increment the version
        id: version
        shell: pwsh
        run: |
          $csproj = '${{ steps.pkg.outputs.project }}'
          $text = [IO.File]::ReadAllText($csproj)
          if ($text -notmatch '<Version>(\d+)\.(\d+)\.(\d+)</Version>') { throw 'No <Version> element found.' }
          $major = [int]$Matches[1]; $minor = [int]$Matches[2]; $patch = [int]$Matches[3]
          switch ('${{ inputs.bump }}') {
            'major' { $major++; $minor = 0; $patch = 0 }
            'minor' { $minor++; $patch = 0 }
            'patch' { $patch++ }
            'none' { }
          }
          $new = "$major.$minor.$patch"
          $text = $text -replace '<Version>\d+\.\d+\.\d+</Version>', "<Version>$new</Version>"
          [IO.File]::WriteAllText($csproj, $text, (New-Object Text.UTF8Encoding($false)))
          "version=$new" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing version $new"

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build ${{ steps.pkg.outputs.project }} -c Release
          dotnet test ${{ steps.pkg.outputs.tests }} -c Release

      - name: Sign in to Azure (federated identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the assembly (Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: ISWIX-LLC
          certificate-profile-name: IsWiX
          files-folder: ${{ github.workspace }}/${{ steps.pkg.outputs.folder }}/bin/Release/net8.0
          files-folder-filter: dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pack
        shell: pwsh
        run: dotnet pack ${{ steps.pkg.outputs.project }} -c Release -o nupkg --no-build

#      - name: Sign NuGet package
#        shell: pwsh
#        run: |
#          ./sign code artifact-signing `
#            --azure-credential-type azure-cli `
#            --verbosity warning `
#            --timestamp-url http://timestamp.acs.microsoft.com `
#            --artifact-signing-endpoint https://eus.codesigning.azure.net/ `
#            --artifact-signing-account ISWIX-LLC `
#            --artifact-signing-certificate-profile IsWiX `
#            ./nupkg/*.nupkg

      - name: Get a short-lived NuGet key (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        shell: pwsh
        run: dotnet nuget push "nupkg/${{ steps.pkg.outputs.name }}.${{ steps.version.outputs.version }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Commit and tag the release
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.pkg.outputs.tagprefix }}' + $v
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ${{ steps.pkg.outputs.project }}
          # With bump "none" the project file is unchanged, so there is nothing to commit; the tag still goes on main.
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Release ${{ steps.pkg.outputs.name }} $v"
            if ($LASTEXITCODE -ne 0) { throw 'Committing the version bump failed.' }
          }
          git tag -a "$tag" -m "Release ${{ steps.pkg.outputs.name }} $v"
          if ($LASTEXITCODE -ne 0) { throw "Tagging $tag failed." }
          # Push the branch and the tag by name, together: --follow-tags alone skips lightweight tags,
          # and --atomic keeps main and the tag from diverging if either is rejected.
          git push --atomic origin main "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Pushing main and $tag failed." }

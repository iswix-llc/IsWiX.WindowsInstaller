name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build IsWiX.WindowsInstaller/IsWiX.WindowsInstaller.csproj -c Release

      - name: Test
        run: dotnet test IsWiX.WindowsInstaller.Tests/IsWiX.WindowsInstaller.Tests.csproj -c Release
